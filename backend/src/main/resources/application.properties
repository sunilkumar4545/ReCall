# HikariCP Zero-Scale Idle Connection Configuration (Neon Compute-Hour Saver)
# Allows pool to drain down to 0 connections so Neon can auto-suspend after 5 mins
spring.datasource.hikari.pool-name=NeonHikariPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.validation-timeout=3000

# JPA & Open-In-View: Prevent Swagger / REST probes from holding connections open
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Flyway: Clean and bounded migration check
spring.flyway.baseline-on-migrate=true
spring.flyway.connect-retries=3

# OpenAPI Swagger UI: Disable eager schema scans
springdoc.swagger-ui.doc-expansion=none
springdoc.cache.disabled=false

# GitHub Auto-Commit Integration (Zero-DB / Zero-B2 Git-Backed Vault)
github.token=${GITHUB_TOKEN:}
github.repo=${GITHUB_REPO:sunilkumar4545/ReCall}
github.branch=${GITHUB_BRANCH:main}
github.base-path=${GITHUB_NOTES_PATH:frontend/src/content/notes}
