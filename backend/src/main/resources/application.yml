# ==============================================================================
# ReCall by sunil4224 – Backend Configuration (Connected to Neon PostgreSQL)
# ==============================================================================
server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: recall-backend

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  # Database Connection: Cloud-Hosted Neon Serverless PostgreSQL
  # Tuned for Zero-Scale: Drops to 0 active connections so Neon suspends compute (0 CU-hrs)
  datasource:
    url: ${NEON_DB_URL:jdbc:postgresql://localhost:5432/neondb}
    username: ${NEON_DB_USER:postgres}
    password: ${NEON_DB_PASS:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: NeonHikariPool
      maximum-pool-size: 5          # Strict limit tailored for Neon serverless pooler
      minimum-idle: 0               # Zero-Scale: Releases ALL idle connections so Neon auto-suspends
      idle-timeout: 30000           # 30 seconds: Closes idle connections after 30s of inactivity
      max-lifetime: 1800000         # 30 minutes: Safely retires connections
      connection-timeout: 20000     # 20 seconds: Ample buffer for Neon 1-3s cold starts
      keepalive-time: 0             # 0 = DISABLED: Stops HikariCP from sending SELECT 1 keepalive pings that reset Neon's 5-min timer
      validation-timeout: 3000

  # JPA & Hibernate Settings (Eliminates Metadata Scans & Open-In-View Connection Leaks)
  jpa:
    open-in-view: false             # CRUCIAL: Disables OSIV so API/Swagger requests don't hold DB connections
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        temp:
          use_jdbc_metadata_defaults: false # Disables catalog queries on startup
        boot:
          allow_jdbc_metadata_access: false # Prevents startup JDBC metadata queries to Neon

  # Flyway Database Migration
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
    connect-retries: 3

# Claim-Check Pattern: Object Storage for GZIP-Compressed Blog & Code Blobs
storage:
  type: ${STORAGE_TYPE:s3} # s3, local, auto
  local:
    base-dir: ${STORAGE_LOCAL_DIR:./data/storage/blobs}
  s3:
    enabled: ${STORAGE_S3_ENABLED:true}
    endpoint: ${STORAGE_S3_ENDPOINT:https://s3.us-east-005.backblazeb2.com}
    bucket: ${STORAGE_S3_BUCKET:recall4224}
    access-key: ${STORAGE_S3_ACCESS_KEY:your_access_key}
    secret-key: ${STORAGE_S3_SECRET_KEY:your_secret_key}
    region: ${STORAGE_S3_REGION:us-east-005}
    path-style-access: ${STORAGE_S3_PATH_STYLE:true}

# CORS & Security
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,https://*.vercel.app,https://*.netlify.app,https://*.onrender.com,https://*.railway.app}

# AI Assistant Configuration (Free Dual-Engine: Google Gemini & Groq Cloud)
ai:
  provider: ${AI_PROVIDER:auto}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:openai/gpt-oss-120b}

# SpringDoc OpenAPI Documentation (Zero DB Probing)
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  cache:
    disabled: false

# GitHub Auto-Commit Integration (Zero-DB / Zero-B2 Git-Backed Vault)
github:
  token: ${GITHUB_TOKEN:}
  repo: ${GITHUB_REPO:sunilkumar4545/ReCall}
  branch: ${GITHUB_BRANCH:main}
  base-path: ${GITHUB_NOTES_PATH:frontend/src/content/notes}

